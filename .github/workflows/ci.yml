name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip ruff
      - run: python -m pip install ".[test]"
      - name: Lint
        run: ruff check .
      - name: Tests (coverage gate 95%)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Seed-42 synthetic demo is reproduced byte for byte
        run: |
          python -m spark_iis demo --out "$RUNNER_TEMP/demo" > /dev/null
          for f in examples/demo/*; do
            cmp "$f" "$RUNNER_TEMP/demo/$(basename "$f")"
          done
          test "$(ls "$RUNNER_TEMP/demo" | wc -l)" = "$(ls examples/demo | wc -l)"
      - name: Console script
        run: |
          cd "$RUNNER_TEMP"
          spark-iis demo --out smoke > /dev/null
          test -s smoke/summary.json
